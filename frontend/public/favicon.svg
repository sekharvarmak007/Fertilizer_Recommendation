<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64" fill="none">
  <defs>
    <!-- Rich Emerald to Teal Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#15803D" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#064E3B" />
    </linearGradient>

    <!-- Vibrant Lime Leaf Gradient -->
    <linearGradient id="leafGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86EFAC" />
      <stop offset="60%" stop-color="#4ADE80" />
      <stop offset="100%" stop-color="#22C55E" />
    </linearGradient>

    <!-- Golden AI Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="100%" stop-color="#FACC15" />
    </linearGradient>

    <!-- Drop Shadow Filter -->
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Outer Rounded Square Icon Badge -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Inner Subtle Glowing Ring -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="none" stroke="#A7F3D0" stroke-opacity="0.25" stroke-width="1.5" />

  <!-- Main Agriculture Leaf Icon (Sprout) -->
  <g filter="url(#shadow)">
    <!-- Right Leaf -->
    <path d="M32 46C32 46 47 38 47 24C47 16 39 12 32 14C32 24 32 46 32 46Z" fill="url(#leafGrad)" />
    
    <!-- Left Leaf Overlay -->
    <path d="M32 46C32 46 17 37 17 22C17 14 26 10 32 14C32 24 32 46 32 46Z" fill="#22C55E" opacity="0.9" />

    <!-- Center Vein -->
    <path d="M32 48V14" stroke="#064E3B" stroke-width="2.5" stroke-linecap="round" />

    <!-- Leaf Vein Branches -->
    <path d="M32 34C37 31 42 30 42 30" stroke="#064E3B" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M32 26C38 23 43 22 43 22" stroke="#064E3B" stroke-width="1.5" stroke-linecap="round" opacity="0.6" />
    <path d="M32 38C27 35 22 34 22 34" stroke="#064E3B" stroke-width="1.5" stroke-linecap="round" opacity="0.5" />
  </g>

  <!-- Top Right AI Intelligence Sparkle ✨ -->
  <g filter="url(#shadow)">
    <path d="M47 8L48.8 13.2L54 15L48.8 16.8L47 22L45.2 16.8L40 15L45.2 13.2L47 8Z" fill="url(#sparkleGrad)" />
    <path d="M20 9L21 12L24 13L21 14L20 17L19 14L16 13L19 12L20 9Z" fill="url(#sparkleGrad)" opacity="0.85" />
  </g>

  <!-- Base Soil Curve -->
  <path d="M16 52C24 49 40 49 48 52" stroke="#86EFAC" stroke-width="2.5" stroke-linecap="round" opacity="0.5" />
</svg>